name = "heilbronn"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Heilbronn"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "Heilbronn"
globs = ["Heilbronn", "Heilbronn.+"]

# The statement a reader audits. `lake comparator` compares it with the root
# module `Heilbronn` (comparator.json); build it alone with `lake build Challenge`.
[[lean_lib]]
name = "Challenge"
