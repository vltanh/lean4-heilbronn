name = "heilbronn"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Heilbronn"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "Heilbronn"
globs = ["Heilbronn", "Heilbronn.+"]

# The statements a reader audits, one Palomar entry per case: `Palomar/<Case>/Challenge.lean`,
# with its `comparator.json` and `formalization.yaml` beside it. `lake comparator` compares each
# with the root module `Heilbronn`; build them alone with `lake build Palomar`.
[[lean_lib]]
name = "Palomar"
globs = ["Palomar.+"]
