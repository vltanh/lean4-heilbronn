name: Palomar preflight

# Runs the Palomar registry's own mechanical verification of this commit for
# one case, the job the registry runs after a submission, without submitting
# anything. Every case is its own entry, in Palomar/<Case>/ (Challenge.lean,
# comparator.json, formalization.yaml). Start it by hand from the Actions tab,
# choosing the case, before submitting a commit. The report is an artifact of
# the run; it must end with `status: pass`.
#
# Keep `uses` and `pipeline_commit` on the same PalomarSubmission commit.

on:
  workflow_dispatch:
    inputs:
      case:
        description: "The case to check, a directory of Palomar/"
        type: choice
        options: [Nine]
        default: Nine

permissions:
  contents: read

jobs:
  preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"Palomar/${{ inputs.case }}/comparator.json","formalization_metadata_path":"Palomar/${{ inputs.case }}/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
