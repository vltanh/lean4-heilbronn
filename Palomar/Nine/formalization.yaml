    configurations that attain it, stated by the three theorems of
    Palomar/Nine/Challenge.lean, Nine.optimal_value, Nine.heilbronn_number
    and Nine.optimal_configurations. Other numbers of points are other
    entries of the same repository.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Heilbronn.Nine.optimal_value"
      file: "Heilbronn/Nine/Uniqueness.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Palomar/Nine/comparator.json"
    - declaration: "Heilbronn.Nine.heilbronn_number"
      file: "Heilbronn/Nine/Uniqueness.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Palomar/Nine/comparator.json"
    - declaration: "Heilbronn.Nine.optimal_configurations"
      file: "Heilbronn/Nine/Uniqueness.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Palomar/Nine/comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["ChatGPT 6 Pro"]
      framework: "ChatGPT"
      tool_setup: >-
        The ChatGPT chat, prompted by the repository owner. It wrote the hand
        proof of nine points (docs/proof/nine/): the manuscripts, the
        certificate packages and their exact checkers, and the research
        notes archived in docs/research/nine/, from 14 to 15 November 2026.
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code in the VS Code extension, with a local Lean toolchain,
        using the formalize-math-paper skill, version 3.4.0, prompted by the
        repository owner. On 15 November 2026 it wrote the whole Lean library:
        the statement, the kernel-checked certificate checkers, the exporters
        of the certificate data, and the proofs of every manuscript on the
        route of the hand proof, with up to twelve sub-agents at once (52 in
        all), each against a private build snapshot of the library. It found
        the certificates that replace some hand arguments by linear
        programming, reorganized the library by case, and wrote the
        documentation. Wall-clock time 7.1 hours, from 14:53 to the last
        proof at 21:56 (US Central time); 51.8 agent-hours; 5,954 tool calls;
        30.09 million input, 2,026 million cache-read and 14.58 million output
        tokens. Spend not tracked.
  notes: >-
    ChatGPT 6 Pro, in the ChatGPT chat, wrote the hand proof of nine points;
    Claude Opus 5.5, in Claude Code, wrote the Lean code. The repository
    owner directed the work and decided its scope and naming.
    docs/contributors.md gives a dated account, and the commits name the
    model that co-authored them.

fidelity:
  divergences: >-
    Statement: none known. H₉ is the supremum of the least triangle area over
    nine points in the closed unit square, with the ordinary area (half the
    absolute determinant); repeated points count separately, so they give
    least area 0. Congruence allows the eight symmetries of the square and a
    relabelling, as in the hand proof. Proofs: the formalization follows the
    route of the hand proof and departs from it in these places. The case of
    three occupied caps (N6-05), which the hand proof reduces to a convex
    nonagon and the affine isoperimetric inequality, is closed by nine
    triangles and a three-cell cubic certificate, so no external theorem is
    used. Certificate covers found by linear programming replace hand case
    analyses: the two interior points of seven boundary points, the exact
    anchor hexagon of six boundary points, Theorems 11 and 12 and class R6 of
    eight boundary points, the quadrants of SIX_BOUNDARY_TWO_SIDE_COMPLETION
    and the chamber in which F moves inward. Every use of a minimum-area
    enclosing parallelogram is replaced by an explicit affine map of
    determinant above one. Gaps of the hand proof were repaired along its
    own lines, among them the empty convex quadrilateral of CORNER_FAMILIES,
    the bound W ≥ (Γ+1)s misquoted as W ≥ 10s, and convexity and sign facts
    left implicit in the Type II, six-boundary and C1 notes; nothing in it
    was found false. docs/results.md lists the departures.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    The statement (Heilbronn/Geometry.lean, restated in
    Palomar/Nine/Challenge.lean) was
    written by Claude and checked by the sanity checks and Comparator; it
    has not yet had a human review, and neither has the mathematics. Lean's
    kernel checks every proof, and lake comparator also replays the compared
    theorems through the NanoDa and con-ron kernels. That establishes the
    proofs, not that the statement says what the prose claims.

alignment:
  namespace: "Heilbronn.Nine"
  statements:
    - source: "H₉ = (9√65 − 55)/320 is the largest least triangle area of nine points in the unit square, and it is attained"
      lean: "Heilbronn.Nine.optimal_value"
      module: "Heilbronn.Nine.Uniqueness"
      status: "proved"
    - source: "The Heilbronn number H₉ equals (9√65 − 55)/320"
      lean: "Heilbronn.Nine.heilbronn_number"
      module: "Heilbronn.Nine.Uniqueness"
      status: "proved"
    - source: "The configurations attaining H₉ are exactly the images of the Comellas–Yebra configuration under the symmetries of the square, relabelled"
      lean: "Heilbronn.Nine.optimal_configurations"
      module: "Heilbronn.Nine.Uniqueness"
      status: "proved"

acknowledgements: >-
  Mathlib, and the Lean toolchain with its lake comparator. F. Comellas and
  J. L. A. Yebra, who found the optimal configuration.
